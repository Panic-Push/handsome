name: iPad build
on:
  push:
    branches: [main, codex/penwise-course-journeys]
    paths: ['ios/**', 'core/**', 'content/**', '.github/workflows/ipad-build.yml']
  pull_request:
    paths: ['ios/**', 'core/**', 'content/**', '.github/workflows/ipad-build.yml']

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check age classification at the adult boundary
        run: |
          xcrun --sdk macosx swiftc -target "$(uname -m)-apple-macos13.0" ios/Penwise/Storage/AppSettings.swift ios/Tests/AgeBandChecks.swift -o "$RUNNER_TEMP/check-age"
          "$RUNNER_TEMP/check-age"
      - name: Build the iPad app for the simulator
        run: >
          xcodebuild -project ios/Penwise.xcodeproj -scheme Penwise
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/PenwiseBuild" ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Verify and package the Debug simulator app
        run: |
          app="$RUNNER_TEMP/PenwiseBuild/Build/Products/Debug-iphonesimulator/Penwise.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "$app/Info.plist")" = 'ca-app-pub-3940256099942544~1458002511'
          /usr/bin/ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Penwise-iPad-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Penwise-Debug-iPad-Simulator-arm64
          path: ${{ runner.temp }}/Penwise-iPad-Simulator.zip
          retention-days: 14
